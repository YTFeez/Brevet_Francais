<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Préparation Brevet Français - 3ème</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .user-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-details {
            display: flex;
            gap: 30px;
        }

        .user-detail {
            display: flex;
            flex-direction: column;
        }

        .user-detail label {
            font-size: 0.85em;
            opacity: 0.9;
        }

        .user-detail span {
            font-size: 1.2em;
            font-weight: bold;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
        }

        .form-container {
            max-width: 500px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .toggle-form a {
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
        }

        .quiz-section {
            margin-top: 30px;
        }

        .quiz-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .question {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ddd;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }

        .option.correct {
            background: #d4edda;
            border-color: #28a745;
        }

        .option.incorrect {
            background: #f8d7da;
            border-color: #dc3545;
        }

        .scoreboard {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }

        .scoreboard h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .scoreboard-table {
            width: 100%;
            border-collapse: collapse;
        }

        .scoreboard-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            text-align: left;
        }

        .scoreboard-table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .scoreboard-table tr:hover {
            background: #e9ecef;
        }

        .rank-badge {
            display: inline-block;
            width: 30px;
            height: 30px;
            line-height: 30px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            color: white;
        }

        .rank-1 { background: #ffd700; color: #333; }
        .rank-2 { background: #c0c0c0; color: #333; }
        .rank-3 { background: #cd7f32; color: white; }
        .rank-other { background: #667eea; }

        .hidden {
            display: none;
        }

        .result-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1em;
        }

        .result-message.correct {
            background: #d4edda;
            color: #155724;
        }

        .result-message.incorrect {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 Préparation Brevet Français</h1>
            <p>Entraîne-toi à la grammaire pour réussir ton brevet !</p>
        </div>

        <!-- Section de connexion -->
        <div id="loginSection">
            <div class="form-container">
                <h2 style="text-align: center; color: #667eea; margin-bottom: 30px;">Connexion</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Établissement</label>
                        <select id="loginEtablissement" required>
                            <option value="">Choisir un établissement</option>
                            <option value="Boris Vian Mézidon Cannon">Boris Vian Mézidon Cannon</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nom</label>
                        <input type="text" id="loginNom" required>
                    </div>
                    <div class="form-group">
                        <label>Prénom</label>
                        <input type="text" id="loginPrenom" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe (5 chiffres)</label>
                        <input type="password" id="loginPassword" maxlength="5" pattern="[0-9]{5}" required>
                    </div>
                    <button type="submit" class="btn">Se connecter</button>
                </form>
                <div class="toggle-form">
                    <p>Pas encore inscrit ? <a onclick="showRegister()">Créer un compte</a></p>
                </div>
            </div>
        </div>

        <!-- Section d'inscription -->
        <div id="registerSection" class="hidden">
            <div class="form-container">
                <h2 style="text-align: center; color: #667eea; margin-bottom: 30px;">Inscription</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label>Établissement</label>
                        <select id="registerEtablissement" required>
                            <option value="">Choisir un établissement</option>
                            <option value="Boris Vian Mézidon Cannon">Boris Vian Mézidon Cannon</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nom</label>
                        <input type="text" id="registerNom" required>
                    </div>
                    <div class="form-group">
                        <label>Prénom</label>
                        <input type="text" id="registerPrenom" required>
                    </div>
                    <div class="form-group">
                        <label>Classe</label>
                        <select id="registerClasse" required>
                            <option value="">Choisir une classe</option>
                            <option value="3A">3A</option>
                            <option value="3B">3B</option>
                            <option value="3C">3C</option>
                            <option value="3D">3D</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Créer un mot de passe (5 chiffres)</label>
                        <input type="password" id="registerPassword" maxlength="5" pattern="[0-9]{5}" required>
                    </div>
                    <button type="submit" class="btn">S'inscrire</button>
                </form>
                <div class="toggle-form">
                    <p>Déjà inscrit ? <a onclick="showLogin()">Se connecter</a></p>
                </div>
            </div>
        </div>

        <!-- Section principale -->
        <div id="mainSection" class="hidden">
            <div class="user-info">
                <div class="user-details">
                    <div class="user-detail">
                        <label>Élève</label>
                        <span id="userName"></span>
                    </div>
                    <div class="user-detail">
                        <label>Classe</label>
                        <span id="userClass"></span>
                    </div>
                    <div class="user-detail">
                        <label>Points</label>
                        <span id="userPoints">0</span>
                    </div>
                    <div class="user-detail">
                        <label>Rang</label>
                        <span id="userRank">-</span>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Déconnexion</button>
            </div>

            <div class="quiz-section">
                <h2 style="color: #667eea; margin-bottom: 20px;">📚 Exercices de Grammaire</h2>
                <div id="quizContainer"></div>
            </div>

            <div class="scoreboard">
                <h2>🏆 Classement des Élèves</h2>
                <table class="scoreboard-table">
                    <thead>
                        <tr>
                            <th>Rang</th>
                            <th>Nom</th>
                            <th>Classe</th>
                            <th>Points</th>
                        </tr>
                    </thead>
                    <tbody id="scoreboardBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Questions de grammaire
        const questions = [
            {
                question: "Quel est le COD dans la phrase : 'Marie mange une pomme' ?",
                options: ["Marie", "mange", "une pomme", "Il n'y en a pas"],
                correct: 2
            },
            {
                question: "Quelle est la nature du mot 'rapidement' ?",
                options: ["Adjectif", "Adverbe", "Nom", "Verbe"],
                correct: 1
            },
            {
                question: "Dans 'Le chat noir dort', quel est l'adjectif qualificatif ?",
                options: ["Le", "chat", "noir", "dort"],
                correct: 2
            },
            {
                question: "Quel est le sujet dans : 'Demain, nous irons au cinéma' ?",
                options: ["Demain", "nous", "irons", "cinéma"],
                correct: 1
            },
            {
                question: "Quelle est la fonction de 'à Paris' dans : 'Je vais à Paris' ?",
                options: ["COD", "COI", "Complément circonstanciel de lieu", "Sujet"],
                correct: 2
            }
        ];

        let currentUser = null;
        let currentQuestion = 0;
        let answered = false;

        // Chargement des données
        function loadData() {
            const usersData = window.localStorage.getItem('brevetUsers');
            return usersData ? JSON.parse(usersData) : [];
        }

        function saveData(users) {
            window.localStorage.setItem('brevetUsers', JSON.stringify(users));
        }

        // Affichage des sections
        function showLogin() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('registerSection').classList.add('hidden');
        }

        function showRegister() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('registerSection').classList.remove('hidden');
        }

        // Inscription
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const users = loadData();
            const newUser = {
                etablissement: document.getElementById('registerEtablissement').value,
                nom: document.getElementById('registerNom').value,
                prenom: document.getElementById('registerPrenom').value,
                classe: document.getElementById('registerClasse').value,
                password: document.getElementById('registerPassword').value,
                points: 0,
                answered: []
            };

            // Vérifier si l'utilisateur existe déjà
            const exists = users.find(u => 
                u.nom === newUser.nom && 
                u.prenom === newUser.prenom && 
                u.etablissement === newUser.etablissement
            );

            if (exists) {
                alert('Un compte existe déjà avec ces informations !');
                return;
            }

            users.push(newUser);
            saveData(users);
            alert('Inscription réussie ! Tu peux maintenant te connecter.');
            showLogin();
            this.reset();
        });

        // Connexion
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const users = loadData();
            const etablissement = document.getElementById('loginEtablissement').value;
            const nom = document.getElementById('loginNom').value;
            const prenom = document.getElementById('loginPrenom').value;
            const password = document.getElementById('loginPassword').value;

            const user = users.find(u => 
                u.etablissement === etablissement &&
                u.nom === nom && 
                u.prenom === prenom && 
                u.password === password
            );

            if (user) {
                currentUser = user;
                showMainSection();
            } else {
                alert('Identifiants incorrects !');
            }
        });

        function showMainSection() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('registerSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            
            document.getElementById('userName').textContent = currentUser.prenom + ' ' + currentUser.nom;
            document.getElementById('userClass').textContent = currentUser.classe;
            updateUserInfo();
            loadQuestion();
            updateScoreboard();
        }

        function logout() {
            currentUser = null;
            currentQuestion = 0;
            answered = false;
            document.getElementById('mainSection').classList.add('hidden');
            showLogin();
        }

        function loadQuestion() {
            if (currentQuestion >= questions.length) {
                document.getElementById('quizContainer').innerHTML = `
                    <div class="quiz-card">
                        <h3 style="text-align: center; color: #667eea;">🎉 Bravo ! Tu as terminé tous les exercices !</h3>
                        <p style="text-align: center; margin-top: 15px;">Total de points : <strong>${currentUser.points}</strong></p>
                        <button class="btn" style="margin-top: 20px;" onclick="restartQuiz()">Recommencer</button>
                    </div>
                `;
                return;
            }

            const q = questions[currentQuestion];
            answered = false;

            let html = `
                <div class="quiz-card">
                    <div class="question">Question ${currentQuestion + 1}/${questions.length}: ${q.question}</div>
                    <div class="options">
            `;

            q.options.forEach((option, index) => {
                html += `<div class="option" onclick="checkAnswer(${index})">${option}</div>`;
            });

            html += `</div><div id="resultMessage"></div></div>`;
            document.getElementById('quizContainer').innerHTML = html;
        }

        function checkAnswer(selected) {
            if (answered) return;
            answered = true;

            const q = questions[currentQuestion];
            const options = document.querySelectorAll('.option');
            const isCorrect = selected === q.correct;

            options[selected].classList.add(isCorrect ? 'correct' : 'incorrect');
            options[q.correct].classList.add('correct');

            // Mettre à jour les points
            const users = loadData();
            const userIndex = users.findIndex(u => 
                u.nom === currentUser.nom && 
                u.prenom === currentUser.prenom && 
                u.etablissement === currentUser.etablissement
            );

            if (isCorrect) {
                users[userIndex].points += 10;
                currentUser.points += 10;
                document.getElementById('resultMessage').innerHTML = `
                    <div class="result-message correct">✓ Bonne réponse ! +10 points</div>
                `;
            } else {
                users[userIndex].points = Math.max(0, users[userIndex].points - 5);
                currentUser.points = Math.max(0, currentUser.points - 5);
                document.getElementById('resultMessage').innerHTML = `
                    <div class="result-message incorrect">✗ Mauvaise réponse ! -5 points<br>La bonne réponse était : ${q.options[q.correct]}</div>
                `;
            }

            saveData(users);
            updateUserInfo();
            updateScoreboard();

            setTimeout(() => {
                currentQuestion++;
                loadQuestion();
            }, 3000);
        }

        function restartQuiz() {
            currentQuestion = 0;
            answered = false;
            loadQuestion();
        }

        function updateUserInfo() {
            document.getElementById('userPoints').textContent = currentUser.points;
            
            const users = loadData();
            users.sort((a, b) => b.points - a.points);
            const rank = users.findIndex(u => 
                u.nom === currentUser.nom && 
                u.prenom === currentUser.prenom && 
                u.etablissement === currentUser.etablissement
            ) + 1;
            
            document.getElementById('userRank').textContent = rank + (rank === 1 ? 'er' : 'ème');
        }

        function updateScoreboard() {
            const users = loadData();
            users.sort((a, b) => b.points - a.points);
            
            let html = '';
            users.forEach((user, index) => {
                const rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : 'rank-other';
                html += `
                    <tr>
                        <td><span class="rank-badge ${rankClass}">${index + 1}</span></td>
                        <td>${user.prenom} ${user.nom}</td>
                        <td>${user.classe}</td>
                        <td><strong>${user.points}</strong></td>
                    </tr>
                `;
            });
            
            document.getElementById('scoreboardBody').innerHTML = html;
        }
    </script>
</body>
</html>
